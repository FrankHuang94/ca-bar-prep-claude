# Study-plan parameters read by scripts/dashboard.py, scripts/build_weeks.py and the /today and /weekly-review commands.
# Finalized in Phase 2 (2026-11-04). Items marked ASSUMPTION need confirmation from the user and are listed in
# 01-study-plan/master-plan.md §8. The week-by-week detail lives in 01-study-plan/schedule.yml.

exam:
  name: California General Bar Examination (GBX)
  dates: [2027-07-27, 2027-07-28]          # confirmed by the State Bar (00-exam-intel/sources.md S-001)
  pass_score: 1390                          # of 2000 (S-011)
  results_expected: "late Oct – early Nov 2027 (estimate; July 2026 results came Oct 30, 2026)"
  fallback_exam: 2028-02-29                 # estimate: last Tuesday of Feb 2028; last current-format exam (V-009)

profile:
  location: San Diego, CA
  timezone: America/Los_Angeles
  employment: full-time (corporate development, tech company)
  test_site_preference: San Diego area     # July 2026 sites included DoubleTree Mission Valley and Chula Vista (S-029)

phases:
  - id: foundation
    start: 2026-11-09
    end: 2027-03-28
    weeks: 20
    hours_per_week: [10, 12]                # finals week ~6 h; holiday weeks ~12 h
    focus: "Gap subjects in study order (Contracts, Civ Pro, Con Law, Crim), then Community Property; MPRE in March; reinforce Fall LL.M. courses with MBE sets; daily flashcards"
  - id: integration
    start: 2027-03-29
    end: 2027-05-02
    weeks: 5
    hours_per_week: [15, 20]
    focus: "Community Property finish, Remedies, CA-law passes of Evidence/PR/Wills/Trusts, Torts and Property refresh, PT method, diagnostic SIM-01"
  - id: intensive
    start: 2027-05-03
    end: 2027-07-11
    weeks: 10
    hours_per_week: [25, 44]                # 25 while still working (W18–W19), 40–44 on study leave
    focus: "Second pass of all 13 subjects, daily timed MBE, 3–5 timed essays/week, 1 PT/week, memorization cycles; SIM-02 (week −6) and SIM-03 (week −3)"
  - id: final-review
    start: 2027-07-12
    end: 2027-07-25
    weeks: 2
    hours_per_week: [30, 35]
    focus: "High-yield review, attack outlines, light timed practice, logistics"
  - id: exam
    start: 2027-07-26
    end: 2027-07-28
    weeks: 1
    hours_per_week: [4, 4]
    focus: "Exam week"

weekly_template:                            # default hours per day while working (foundation); /today scales it to the week's target
  mon: 1.25
  tue: 1.25
  wed: 1.25
  thu: 1.25
  fri: 0.75
  sat: 3.0
  sun: 3.0

leave:
  - start: 2027-05-17                       # ASSUMPTION — recommended minimum; see master-plan.md §4 (options A/B/C)
    end: 2027-07-28
    type: full-time study leave
    status: proposed
    note: "Request from employer by ~Feb 15, 2027. 35–45 h/week is not realistic alongside a full-time job."

