# Study-plan parameters read by scripts/dashboard.py, scripts/build_weeks.py and the /today and /weekly-review commands.
# Finalized in Phase 2 and revised 2026-11-04 with the user's inputs (Route B, no leave, 3–4 h weekdays + 20 h weekends).
# Items marked ASSUMPTION need confirmation from the user and are listed in
# 01-study-plan/master-plan.md §8. The week-by-week detail lives in 01-study-plan/schedule.yml.

exam:
  name: California General Bar Examination (GBX)
  dates: [2027-07-27, 2027-07-28]          # confirmed by the State Bar (00-exam-intel/sources.md S-001)
  pass_score: 1390                          # of 2000 (S-011)
  results_expected: "late Oct – early Nov 2027 (estimate; July 2026 results came Oct 30, 2026)"
  fallback_exam: 2028-02-29                 # estimate: last Tuesday of Feb 2028; last current-format exam (V-009)

profile:
  location: San Diego, CA
  timezone: America/Los_Angeles
  employment: full-time (corporate development, tech company)
  test_site_preference: San Diego area     # July 2026 sites included DoubleTree Mission Valley and Chula Vista (S-029)

phases:
  - id: foundation
    start: 2026-11-09
    end: 2027-03-28
    weeks: 20
    hours_per_week: [10, 35]                # Nov 10–12 h; from Dec 28–35 h (user capacity 35–40; margin for LL.M. coursework); finals week 15 h; holiday/deload weeks 28 h
    focus: "FIRST PASS of all 13 subjects by Mar 28: Contracts, Civ Pro, Con Law, Crim (Nov–Jan), Community Property, Remedies, Evidence, PR, Wills, Trusts, Torts, Real Property (Feb–Mar); MPRE in March; daily MBE + flashcards"
  - id: integration
    start: 2027-03-29
    end: 2027-05-02
    weeks: 5
    hours_per_week: [36, 36]
    focus: "Finish Real Property + Business Associations; diagnostic SIM-01 (Apr 10–11); second pass on weakest subjects; crossover month; PTs weekly"
  - id: intensive
    start: 2027-05-03
    end: 2027-07-11
    weeks: 10
    hours_per_week: [35, 38]                # NO study leave: 3–4 h every weekday evening + ~20 h across the weekend
    focus: "Second pass of all 13 subjects, daily timed MBE, 4–5 timed essays/week (weeknights), 1 PT/week (weekends), memorization cycles; SIM-02 (week −6) and SIM-03 (week −3) on weekends"
  - id: final-review
    start: 2027-07-12
    end: 2027-07-25
    weeks: 2
    hours_per_week: [32, 35]
    focus: "High-yield review, attack outlines, light timed practice, logistics"
  - id: exam
    start: 2027-07-26
    end: 2027-07-28
    weeks: 1
    hours_per_week: [4, 4]
    focus: "Exam week"

weekly_template:                            # November default (10–12 h/week); /today scales it to the week's target
                                            # from December (user capacity, confirmed 2026-11-04): weekdays 3–4 h each, ~10 h each weekend day
  mon: 1.25
  tue: 1.25
  wed: 1.25
  thu: 1.25
  fri: 0.75
  sat: 3.0
  sun: 3.0

leave: []                                   # user (2026-11-04): full-time leave is not possible; PTO only for exam week (Jul 26–29)

pto:                                        # recommended PTO (not leave)
