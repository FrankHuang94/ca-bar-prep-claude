# Week-by-week schedule: the single source of truth for 01-study-plan/weeks/*.md.
# Render with:  python scripts/build_weeks.py --force            (all weeks)
#               python scripts/build_weeks.py --from 2027-W05    (re-render future weeks after an adjustment)
# Edit THIS file (not the generated week files) when /weekly-review changes the plan.
#
# Fields: week (ISO), phase, hours (target), theme, learn [..], reinforce [..],
#   mbe {n, mix {CODE: n}}, essays {n, subjects [..], mode untimed|timed}, spot n, pt {n, mode},
#   sim {id, days}, checkpoint (CP id), buffer (bool), overrides {Mon..Sun: text}, notes.
# Subject codes: BUS CIV CMP CON CTR CRM EVD PRF PRP REM TRT WIL TRS. Coverage prefixes like CTR-MBE-I
# work with `/quiz <subject> <n> <difficulty> <subtopic>`.

