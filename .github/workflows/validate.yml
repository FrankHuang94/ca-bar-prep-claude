name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate repository (front matter, coverage matrix, citations, question bank, links)
        run: python scripts/validate.py
      - name: Test tooling
        run: python -m pytest -q scripts/tests
      - name: Coverage report (informational)
        run: python scripts/coverage_report.py
