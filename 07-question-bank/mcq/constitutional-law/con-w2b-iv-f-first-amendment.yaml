- id: Q-CON-0150
  subject: CON
  coverage_ids: [CON-MBE-IV.F.4]
  rule_ids: [R-CON-110, R-CON-111]
  difficulty: 2
  stem: >-
    A city requires any organization that applies for a permit to hold a rally in a city park to file a
    list of the names and home addresses of all its members who live in the city; the lists are public
    records. The city says the lists help it identify who is responsible if a rally damages park property.
    The permit rules separately require each applicant to designate an officer who is responsible for the
    event and to post a $500 damage bond. A small advocacy organization supporting an unpopular cause
    applied for a permit and refused to file a membership list, presenting uncontradicted evidence that
    members whose affiliation became public had lost jobs and received threats. Its permit was denied for
    that reason, and it sued.
  call: "Is the membership-list requirement constitutional as applied to the organization?"
  options:
    A: "Yes, because the names of an organization's members are facts, not speech, so the First Amendment does not protect them."
    B: "Yes, because the requirement applies to every organization regardless of viewpoint, so it is a valid content-neutral rule for park use."
    C: "No, because compelled disclosure of members must be substantially related to a sufficiently important interest, and the list adds little here."
    D: "No, because the government may never require an organization to disclose any information about the people who belong to it."
  answer: C
  explanation_correct: >-
    C is correct. Compelled disclosure of an organization's members can deter association, especially for
    groups supporting unpopular causes, so it is subject to exacting scrutiny: there must be a substantial
    relation between the disclosure requirement and a sufficiently important governmental interest
    (R-CON-110; NAACP v. Alabama ex rel. Patterson), and the Court has struck down disclosure demands that
    sweep far more broadly than the interest they serve (Shelton v. Tucker; Americans for Prosperity Found.
    v. Bonta). The city's interest in recovering for park damage is already served by the designated
    responsible officer and the damage bond; a public list of every member who lives in the city adds
    little to it, while the uncontradicted evidence shows that disclosure exposes members to reprisals.
  explanation_each_wrong_option:
    A: >-
      Wrong rule. Freedom of association protects the privacy of group membership because disclosure can
      chill association (R-CON-110; NAACP v. Alabama).
    B: >-
      Wrong framework. Viewpoint neutrality does not save a disclosure requirement; compelled disclosure of
      membership gets exacting scrutiny even when it applies to every group (R-CON-110).
    D: >-
      Overbroad. Disclosure requirements that are substantially related to important interests, such as
      many campaign-finance disclosure rules, are upheld (R-CON-110; R-CON-111).
  trap_type: wrong-standard
  authority: ["U.S. Const. amend. I", "NAACP v. Alabama ex rel. Patterson, 357 U.S. 449 (1958)", "Shelton v. Tucker, 364 U.S. 479 (1960)", "Americans for Prosperity Found. v. Bonta, 594 U.S. 595 (2021)"]
  source: original
  tags: [wave2, w2b, freedom-of-association, compelled-disclosure]
  status: draft
  last_verified: 2026-11-05
