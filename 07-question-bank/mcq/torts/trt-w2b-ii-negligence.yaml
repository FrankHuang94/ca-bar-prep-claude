- id: Q-TRT-0133
  subject: TRT
  coverage_ids: [TRT-MBE-II.G.1]
  rule_ids: [R-TRT-069, R-TRT-070]
  difficulty: 2
  stem: >-
    A pedestrian wearing headphones negligently walked into a lane of traffic in the middle of a block without
    looking. A motorist traveling at a lawful speed saw him from 300 feet away and had ample time to stop, but she was
    adjusting her navigation app and did not brake until it was too late. The pedestrian suffered $200,000 in damages.
    The jury found the pedestrian 25% at fault and the motorist 75% at fault. The jurisdiction applies pure
    comparative negligence. The pedestrian argues that because the motorist had the last clear chance to avoid the
    accident, he should recover his full damages.
  call: "How much will the pedestrian recover?"
  options:
    A: "$200,000, because the motorist had the last clear chance to avoid the accident and negligently failed to use it."
    B: "Nothing, because his own negligence in walking into traffic contributed to his injuries."
    C: "$150,000, but only because the motorist had the last clear chance; without it his negligence would bar recovery."
    D: "$150,000, because last clear chance plays no role, and his damages are reduced by his 25% share of fault."
  answer: D
  explanation_correct: >-
    Last clear chance softened the harshness of contributory negligence as a complete bar (R-TRT-069). Under
    comparative negligence the doctrine has no separate role: the motorist's later opportunity to avoid the accident
    is reflected in the percentages of fault the jury assigns (R-TRT-070). The pedestrian recovers $200,000 reduced by
    his 25% share, or $150,000.
  explanation_each_wrong_option:
    A: >-
      Minority rule. Last clear chance is a contributory-negligence doctrine; comparative-fault jurisdictions
      generally absorb it into the allocation of fault, so it does not restore full damages here (R-TRT-069,
      R-TRT-070).
    B: >-
      Contributory negligence as a complete bar is not the rule in a pure comparative-negligence jurisdiction.
    C: >-
      Right amount, wrong reason. Under pure comparative negligence the pedestrian's negligence would not bar recovery
      even without any last-clear-chance argument; the reduction follows from comparative fault alone.
  trap_type: minority-rule
  authority: ["Li v. Yellow Cab Co., 13 Cal.3d 804 (1975)"]
  source: original
  tags: [wave2, W2b-TRT, negligence, defenses, last-clear-chance, comparative-fault]
  status: verified
  last_verified: "2026-11-05"

- id: Q-TRT-0134
  subject: TRT
  coverage_ids: [TRT-MBE-II.G.2]
  rule_ids: [R-TRT-071, R-TRT-072]
  difficulty: 2
  stem: >-
    Before a guided trail ride, a riding stable had an adult customer sign a form that read: "I understand that
    horseback riding involves inherent risks, including that horses may buck, bolt or stumble, and I assume all such
    inherent risks." The form said nothing else about the stable's liability. During the ride, the customer's saddle
    slipped sideways because a stable employee had carelessly failed to tighten its girth strap, and she fell and
    broke her arm. She sues the stable for negligence.
  call: "Does the signed form bar her claim?"
  options:
    A: "No, because the form does not clearly release the stable from liability for its own negligence."
    B: "Yes, because she expressly assumed the risks of horseback riding, and falling from a horse is one of them."
    C: "Yes, because pre-injury releases for voluntary recreational activities are generally enforceable."
    D: "No, because a pre-injury release of liability for negligence is void as against public policy."
  answer: A
  explanation_correct: >-
    An express assumption of risk bars a negligence claim only if the agreement clearly and unambiguously covers the
    defendant's negligence (R-TRT-071). This form assumed only the inherent risks of riding, such as a horse that
    bucks or stumbles; it said nothing about the stable's own carelessness. A saddle that slips because an employee
    failed to tighten the girth is a risk created by the stable's negligence, not one inherent in riding, so the form
    does not bar the claim.
  explanation_each_wrong_option:
    B: >-
      Overbroad reading. Assuming the inherent risks of an activity does not assume the risk of the operator's
      negligence, even if the resulting injury, a fall, is the same.
    C: >-
      True but irrelevant. Recreational releases are generally enforced for ordinary negligence when their language
      clearly covers it; this form does not.
    D: >-
      Overbroad. Releases of ordinary negligence are generally enforceable in recreational settings; they fail for
      gross negligence, intentional or reckless misconduct, or services affecting the public interest (R-TRT-071).
  trap_type: overbroad
  authority: ["Restatement (Second) of Torts § 496B"]
  source: original
  tags: [wave2, W2b-TRT, negligence, defenses, express-assumption, release]
  status: verified
  last_verified: "2026-11-05"

- id: Q-TRT-0135
  subject: TRT
  coverage_ids: [TRT-MBE-II.G.2]
  rule_ids: [R-TRT-072, R-TRT-070]
  difficulty: 3
  stem: >-
    A tenant lived on the third floor of an apartment building whose only exit was a common stairway controlled by the
    landlord. The stairway's handrail broke, and for two weeks the landlord negligently failed to repair it despite
    the tenant's repeated requests. One morning the tenant, who knew the handrail was broken, walked down the stairs
    to go to work, keeping one hand on the wall and moving carefully. She lost her footing on a step, had no handrail
    to grab, and fell, breaking her ankle. In her negligence action, the landlord argues that she assumed the risk.
    The jurisdiction applies pure comparative negligence.
  call: "How is the landlord's assumption-of-risk argument likely to affect her recovery?"
  options:
    A: "It will bar her recovery, because she knew of the broken handrail and voluntarily chose to use the stairs anyway."
    B: "It will reduce her recovery in proportion to her fault in choosing to use stairs she knew were unsafe."
    C: "It will not affect her recovery, because she had no reasonable alternative to the stairs and used them carefully."
    D: "It will not affect her recovery, because assumption of risk has been abolished in every comparative-negligence jurisdiction."
  answer: C
  explanation_correct: >-
    Implied assumption of risk requires a voluntary choice to encounter a known risk, and a choice is not voluntary
    when the defendant's negligence leaves the plaintiff no reasonable alternative to exercising a right, such as
    leaving her own home (R-TRT-072; R2d § 496E). The stairway was the tenant's only exit, and she used it carefully.
    Her conduct was neither a voluntary assumption of the risk nor unreasonable, so there is nothing to compare under
    pure comparative negligence (R-TRT-070), and her recovery is not reduced.
  explanation_each_wrong_option:
    A: >-
      Missing element. Knowledge alone is not enough; the encounter must be voluntary. Moreover, under comparative
      negligence an unreasonable implied assumption of risk reduces rather than bars recovery.
    B: >-
      A reduction requires unreasonable conduct by the plaintiff. Using the only exit from her home, and doing so
      carefully, was reasonable.
    D: >-
      Overbroad. Express assumption of risk, and the no-duty rule for risks inherent in an activity, survive in
      comparative-fault jurisdictions; only unreasonable implied assumption of risk merges into comparative fault.
  trap_type: missing-element
  authority: ["Restatement (Second) of Torts § 496E"]
  source: original
  tags: [wave2, W2b-TRT, negligence, defenses, implied-assumption, voluntariness]
  status: verified
  last_verified: "2026-11-05"
