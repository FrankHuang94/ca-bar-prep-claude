questions:
- id: Q-PRP-0012
  subject: PRP
  coverage_ids: [PRP-MBE-II.A.1, PRP-MBE-II.A.4]
  rule_ids: [R-PRP-050, R-PRP-052]
  difficulty: 2
  stem: >-
    Kemal and Lucia owned adjoining hillside lots, which they had bought from different sellers. To protect their
    views, they signed and recorded a written agreement in which each promised, "for myself, my heirs and assigns,"
    not to build any structure taller than one story on his or her lot, and stated that the promises would run with
    both lots. Neither of them conveyed any interest in land to the other. Kemal later sold his lot to Moss, who read
    the recorded agreement before buying. Moss built a three-story house that blocks Lucia's view, and Lucia sued Moss
    for damages only. The jurisdiction follows the traditional common-law requirements for covenants that run with
    the land.
  call: "Is Lucia likely to recover damages from Moss?"
  options:
    A: "Yes, because the promise was in a recorded writing and Moss had actual notice of it."
    B: "Yes, because the promise touches and concerns both lots and the parties intended it to bind successors."
    C: "No, because Kemal and Lucia were not in horizontal privity, so the burden of the promise does not run at law."
    D: "No, because a restriction on building height can be enforced only by an injunction, never by damages."
  answer: C
  explanation_correct: >-
    C is correct. For the burden of a promise to run at law, so that a successor is liable in damages, the
    traditional rule requires a writing, intent to bind successors, touch and concern, notice, vertical privity, and
    horizontal privity between the original promisor and promisee (R-PRP-050). Horizontal privity means the promise
    was made in connection with a conveyance of an interest in land between the original parties, such as
    grantor-grantee or landlord-tenant. Kemal and Lucia were neighbors who conveyed nothing to each other, so the
    burden does not run as a real covenant, and Lucia cannot recover damages from Moss. She should instead seek an
    injunction: as an equitable servitude the promise binds Moss, who had notice, without any privity of estate
    (R-PRP-052).
  explanation_each_wrong_option:
    A: >-
      Writing and notice are elements of a real covenant, but they do not supply the missing horizontal privity that
      a damages action against a successor requires (R-PRP-050).
    B: >-
      Intent and touch and concern are satisfied, but they are only two of the six elements; horizontal privity is
      still missing (R-PRP-050).
    D: >-
      Right result, wrong reason. A real covenant that satisfies every element, including a building-height
      restriction, is enforceable by damages; Lucia loses here only because horizontal privity is lacking.
  trap_type: missing-element
  authority: ["Common law: running of the burden of real covenants (horizontal privity)", "Tulk v. Moxhay (1848) 2 Ph. 774, 41 Eng. Rep. 1143"]
  source: original
  tags: [wave1, M4, real-covenants, equitable-servitudes]
  status: draft
  last_verified: 2026-11-04

- id: Q-PRP-0013
  subject: PRP
  coverage_ids: [PRP-MBE-II.A.2]
  rule_ids: [R-PRP-053, R-PRP-052]
  difficulty: 2
  stem: >-
    In 2010 Brightwater Homes recorded a plat dividing its tract into 40 lots and marketed the tract as "an
    exclusively residential community." Between 2010 and 2013 it sold 39 of the lots by deeds that each contained a
    covenant, binding the buyer's heirs and assigns, that the lot would be used only for a single-family residence.
    Through an oversight, the 2012 deed of Lot 17 to Ezra omitted the covenant, although Ezra had read the
    developer's sales brochure describing the restriction. Every lot in the tract now has a single house on it. In 2025 Ezra sold Lot 17 to Fenn, whose title examiner showed Fenn the recorded deeds of the
    neighboring lots containing the covenant. Fenn announced plans to build a convenience store on Lot 17, and Gail,
    who bought Lot 3 in 2010, sued Fenn to enjoin construction of the store.
  call: "Is Gail likely to obtain the injunction?"
  options:
    A: "No, because no deed in Fenn's chain of title contains the residential restriction."
    B: "No, because Gail bought her lot before Lot 17 was sold and therefore cannot enforce a restriction against it."
    C: "Yes, because Lot 17 is bound by an implied reciprocal servitude arising from the developer's general plan, and Fenn had notice of the plan."
    D: "Yes, because a developer's recorded plat by itself binds every lot in the tract to the uses described in the developer's advertising."
  answer: C
  explanation_correct: >-
    C is correct. When a developer sells lots under a general plan of restrictions and most deeds contain the
    restriction, courts imply a reciprocal negative servitude that binds every lot in the plan, including a lot whose
    deed omits the restriction, if its owner took with notice (R-PRP-053; Sanborn v. McLean). The recorded plat, the
    marketing, and the restriction in 39 of 40 deeds show a plan that existed when sales began in 2010; when the
    first lots were sold, the servitude attached to the lots Brightwater kept, including Lot 17. Ezra took Lot 17 with
    notice of the plan, and Fenn had notice from the recorded deeds of the neighboring lots, reinforced by the
    uniformly residential appearance of the tract, so neither can claim to be a purchaser without notice.
    Gail, an owner within the plan, may enforce the servitude by injunction (R-PRP-052).
  explanation_each_wrong_option:
    A: >-
      Under the majority common-scheme doctrine, a lot can be bound even though no deed in its own chain contains the
      restriction. Requiring a recorded instrument that imposes the restriction is California's position (Riley v.
      Bear Creek Planning Committee; R-PRP-053), which does not apply on the MBE.
    B: >-
      Under the implied reciprocal servitude doctrine, the servitude burdens the developer's retained lots from the
      first sale under the plan, so earlier purchasers may enforce it against lots sold later (R-PRP-053).
    D: >-
      A plat and advertising alone do not bind lots. The servitude rests on a general plan shown by the restrictions
      actually imposed in the deeds, together with notice to the burdened owner (R-PRP-053).
  trap_type: minority-rule
  authority: ["Sanborn v. McLean, 233 Mich. 227, 206 N.W. 496 (1925)", "Common law: implied reciprocal negative servitudes"]
  source: original
  tags: [wave1, M4, common-scheme, equitable-servitudes]
  status: draft
  last_verified: 2026-11-04

- id: Q-PRP-0014
  subject: PRP
  coverage_ids: [PRP-MBE-II.A.5]
  rule_ids: [R-PRP-056, R-PRP-017]
  difficulty: 1
  stem: >-
    Every deed in the 25-lot Maple Hollow subdivision restricts the lot to residential use. Over the past fifteen
    years, a highway interchange was built just outside the subdivision, and the land across the road from it has
    filled with gas stations, restaurants and a shopping center. Inside the subdivision, all 25 lots are still used as
    homes, and the homes remain in demand. Oscar owns a lot on the subdivision's edge facing the highway; he could
    sell it for three times its residential value if he could build a fast-food restaurant on it. When Oscar applied
    for a building permit, his neighbors sued to enforce the restriction, and Oscar argued that changed conditions
    had ended it.
  call: "Will the court likely enforce the restriction against Oscar?"
  options:
    A: "Yes, because the restriction still substantially benefits the lots inside the subdivision."
    B: "No, because the commercial development has made Oscar's lot far more valuable for business use than as a residence."
    C: "No, because a restriction that prevents the most valuable use of land is an unreasonable restraint on alienation."
    D: "Yes, because changed conditions are never a defense to the enforcement of a restrictive covenant."
  answer: A
  explanation_correct: >-
    A is correct. Changed conditions end a restriction only when the change is so radical that the restriction can no
    longer achieve its purpose; changes outside the restricted area rarely qualify while the restriction still
    benefits the lots inside it (R-PRP-056). All 25 Maple Hollow lots remain homes in demand, so the residential
    restriction still delivers its intended benefit, and border lots facing the change remain bound when interior lots
    still benefit. The higher commercial value of Oscar's lot does not matter.
  explanation_each_wrong_option:
    B: >-
      Wrong standard. A rise in commercial value (or a drop in residential value) does not show that the
      restriction's purpose has failed (R-PRP-056).
    C: >-
      Use restrictions in a subdivision plan limit how land is used, not whether it can be transferred; reasonable
      restrictions of this kind are not unreasonable restraints on alienation (R-PRP-017).
    D: >-
      Overbroad. Changed conditions is a recognized defense; it fails here on the facts, not as a matter of law
      (R-PRP-056).
  trap_type: wrong-standard
  authority: ["Common law: changed-conditions doctrine"]
  source: original
  tags: [wave1, M4, covenant-termination]
  status: draft
  last_verified: 2026-11-04

- id: Q-PRP-0015
  subject: PRP
  coverage_ids: [PRP-MBE-II.A.6]
  rule_ids: [R-PRP-054, R-PRP-058, R-PRP-050]
  difficulty: 1
  stem: >-
    Before selling any lot, the developer of Cedar Ridge recorded a declaration requiring each lot owner, and each
    owner's successors, to pay an annual assessment to the Cedar Ridge Owners Association to maintain the
    subdivision's private roads, storm drains and park, and making unpaid assessments a lien on the lot. Each deed
    from the developer referred to the declaration. Sid bought a lot from one of the original purchasers by a deed
    that did not mention the declaration. Sid never read the declaration and refuses to pay the $900 annual
    assessment, saying that he never agreed to it. The association has sued Sid.
  call: "Is the association likely to recover the assessment?"
  options:
    A: "No, because a promise to pay money is a personal obligation that cannot run with the land."
    B: "No, because Sid did not sign the declaration or any other document containing the promise."
    C: "No, because Sid had no actual knowledge of the declaration when he bought his lot."
    D: "Yes, because the covenant touches and concerns the land, and Sid took with record notice of it."
  answer: D
  explanation_correct: >-
    D is correct. An affirmative covenant to pay money runs with the land when the money is used to maintain or
    improve property that benefits the burdened lots, such as private roads, drains and a park; such a covenant
    touches and concerns the land (R-PRP-054; Neponsit). The declaration was in writing, recorded before any sale,
    referred to in each deed from the developer, and expressly bound successors, so it bound Sid, who took the lot
    with record notice (R-PRP-050, R-PRP-058). His failure to read the declaration is irrelevant.
  explanation_each_wrong_option:
    A: >-
      Overbroad. Courts are more cautious with affirmative covenants, but they enforce assessment covenants whose
      proceeds maintain property benefiting the lots (R-PRP-054).
    B: >-
      A successor need not sign anything; the burden runs to a successor who takes the burdened land with notice of
      the recorded writing (R-PRP-050).
    C: >-
      Notice may be actual, inquiry or record. A properly recorded declaration referred to in the chain of title
      gives record notice (R-PRP-050).
  trap_type: overbroad
  authority: ["Neponsit Property Owners' Ass'n v. Emigrant Industrial Savings Bank, 278 N.Y. 248, 15 N.E.2d 793 (1938)", "Common law: covenants running with the land"]
  source: original
  tags: [wave1, M4, hoa, affirmative-covenants]
  status: draft
  last_verified: 2026-11-04

- id: Q-PRP-0016
  subject: PRP
  coverage_ids: [PRP-MBE-II.B.2, PRP-MBE-II.B.5]
  rule_ids: [R-PRP-063, R-PRP-062, R-PRP-064, R-PRP-068]
  difficulty: 3
  stem: >-
    Opal owned a 200-acre tract bordered on the south by a county road. The northern 80 acres were woods with no
    road, path or other improvement, and Opal had never crossed the southern part of the tract to reach them. In 2008
    Opal sold the northern 80 acres to Pax; the only access to that parcel was across Opal's remaining land. Pax
    cleared and graveled a lane across Opal's land and used it daily to reach a cabin he built. In 2023 the state
    opened a public highway along the northern parcel's far boundary, giving it direct access to a public road. In
    2024 Opal fenced off the lane. The prescriptive period in the jurisdiction is ten years. Pax sued to establish
    his right to keep using the lane.
  call: "Is Pax likely to prevail?"
  options:
    A: "Yes, because Pax has used the lane openly and continuously for longer than the prescriptive period."
    B: "Yes, because an easement implied from a use existing at severance does not end when the necessity ends."
    C: "No, because an easement by necessity lasts only as long as the necessity that created it."
    D: "No, because an easement cannot be implied in favor of a buyer who could have bargained for an express easement."
  answer: C
  explanation_correct: >-
    C is correct. When Opal sold the landlocked northern parcel in 2008, an easement by necessity arose across her
    retained land: there was unity of title, a severance, and strict necessity at the time of severance (R-PRP-063).
    But an easement by necessity lasts only as long as the necessity. Once the new highway gave the northern parcel
    direct public access in 2023, the easement ended, and Opal was entitled to fence the lane (R-PRP-063,
    R-PRP-068).
  explanation_each_wrong_option:
    A: >-
      Prescription requires adverse use (R-PRP-064). Until 2023 Pax used the lane as of right under his easement by
      necessity, so the use was not hostile; after the necessity ended he used it for only about a year before Opal
      fenced it.
    B: >-
      An easement implied from prior use requires an apparent and continuous use by the common owner before severance
      (R-PRP-062). Opal never used any route across the southern land to reach the woods, so there was no
      quasi-easement; Pax built the lane after the sale. This misreads the facts.
    D: >-
      An easement by necessity is implied precisely because the conveyance failed to provide access; the buyer's
      ability to bargain for an express easement does not defeat it (R-PRP-063).
  trap_type: fact-misread
  authority: ["Common law: easement by necessity", "Common law: easement implied from prior use"]
  source: original
  tags: [wave1, M4, easements, necessity]
  status: draft
  last_verified: 2026-11-04

- id: Q-PRP-0017
  subject: PRP
  coverage_ids: [PRP-MBE-II.B.2]
  rule_ids: [R-PRP-064, R-PRP-107, R-PRP-119]
  difficulty: 3
  stem: >-
    In 2010 Ari bought Lot 1 and began driving daily across a strip along the edge of Ben's adjoining Lot 2 to reach a
    public road; the tire tracks were plainly visible. Ari never asked for permission, and Ben never objected. In
    2016 Ari sold Lot 1 to Cal by a deed that did not mention the driveway, and Cal continued the same daily use. In
    2021 Ben sold Lot 2 to Dee; nothing in the land records referred to the driveway. In 2022 Dee blocked the strip.
    The prescriptive period in the jurisdiction is ten years. Cal sued Dee to establish an easement.
  call: "Who is likely to prevail?"
  options:
    A: "Dee, because neither Ari nor Cal used the strip for ten years."
    B: "Cal, because he may add Ari's period of use to his own, and the easement was complete before Dee bought Lot 2."
    C: "Dee, because she bought Lot 2 without notice in the land records of any driveway easement."
    D: "Dee, because Ari's deed to Cal did not mention the driveway, so Ari's period of use did not pass to Cal."
  answer: B
  explanation_correct: >-
    B is correct. A prescriptive easement requires use that is open and notorious, continuous and adverse for the
    statutory period, and successive users in privity may tack their periods together (R-PRP-064, R-PRP-107). Ari's
    conveyance of Lot 1 to Cal supplied privity even though the deed did not mention the driveway, so Cal may add
    Ari's 2010-2016 use to his own. The ten years ran in 2020, before Dee bought Lot 2. Dee took subject to the
    easement: the recording acts do not protect purchasers against interests that arise off the record, such as
    prescriptive easements, and the visible tracks would in any event have given her inquiry notice (R-PRP-119).
  explanation_each_wrong_option:
    A: >-
      Tacking is allowed between successive users in privity; no single user needs to complete the full period
      (R-PRP-064).
    C: >-
      True but irrelevant. The land records were silent, but a prescriptive easement arises by operation of law
      outside the recording system, so a purchaser's lack of record notice does not cut it off (R-PRP-119).
    D: >-
      Privity for tacking comes from the voluntary transfer of the dominant land itself; the deed need not describe
      the inchoate prescriptive right (R-PRP-064, R-PRP-107).
  trap_type: true-but-irrelevant
  authority: ["Common law: prescriptive easements and tacking"]
  source: original
  tags: [wave1, M4, easements, prescription]
  status: draft
  last_verified: 2026-11-04

- id: Q-PRP-0018
  subject: PRP
  coverage_ids: [PRP-MBE-II.B.3]
  rule_ids: [R-PRP-066, R-PRP-060]
  difficulty: 2
  stem: >-
    Hollis owns Parcel A, which has an express, recorded easement "for ingress and egress to and from Parcel A" over a
    driveway on Ines's adjoining land. Hollis later bought Parcel B, which adjoins Parcel A on the side away from
    Ines's land and has no access of its own except a steep logging trail. Hollis built a guest house on Parcel B and
    began driving across Ines's driveway, then through Parcel A, to reach it. The added traffic is about four trips a
    day. Ines sued to stop the use.
  call: "Is Hollis's use of the driveway to reach Parcel B within the scope of the easement?"
  options:
    A: "Yes, because a modest increase in traffic is a change in degree, which an easement holder may make."
    B: "Yes, because an appurtenant easement benefits all land owned by the holder of the dominant estate."
    C: "No, because an appurtenant easement may be used only to benefit the dominant estate, and Parcel B is not part of it."
    D: "No, because an easement holder may not increase the number of trips over the servient land beyond those made when the easement was created."
  answer: C
  explanation_correct: >-
    C is correct. An appurtenant easement exists for the benefit of the dominant estate and may not be used to serve
    other land, even land the dominant owner later acquires (R-PRP-066; Brown v. Voss). Parcel A is the dominant
    estate and Parcel B is not, so driving across Ines's driveway to reach the guest house on Parcel B exceeds the
    easement's scope. Ines's remedy is relief against the excess use (typically an injunction, or damages); misuse
    does not terminate the easement, which still serves Parcel A.
  explanation_each_wrong_option:
    A: >-
      The change-in-degree rule allows more intensive use by the dominant estate itself; it does not allow the
      easement to serve a different parcel (R-PRP-066).
    B: >-
      Overbroad. An appurtenant easement benefits only the parcel to which it is attached, not every parcel its holder
      owns (R-PRP-060, R-PRP-066).
    D: >-
      Right result, wrong reason. Normal growth in the dominant estate's use is a permitted change in degree; the
      problem is service to a non-dominant parcel, not the number of trips (R-PRP-066).
  trap_type: confused-rule
  authority: ["Brown v. Voss, 105 Wash. 2d 366, 715 P.2d 514 (1986)", "Common law: scope of easements"]
  source: original
  tags: [wave1, M4, easements, scope]
  status: draft
  last_verified: 2026-11-04

- id: Q-PRP-0019
  subject: PRP
  coverage_ids: [PRP-MBE-II.B.5]
  rule_ids: [R-PRP-068]
  difficulty: 1
  stem: >-
    In 2004 Quill acquired, by a recorded deed from his neighbor Rook, an express easement to use a footpath across
    Rook's land to reach a lake. Quill used the path until 2009, when he took a job overseas; his house stood empty,
    and nobody used the path until he returned in 2025. While he was away, Quill said and wrote nothing about the
    easement. In 2023 Rook planted a row of shrubs across the path. When Quill returned and asked Rook to remove the
    shrubs, Rook refused, saying the easement had been abandoned. The prescriptive period in the jurisdiction is ten
    years.
  call: "Is Quill entitled to use the path?"
  options:
    A: "No, because Quill's nonuse of the easement lasted longer than the prescriptive period, which is enough to show abandonment."
    B: "Yes, because nonuse alone, without conduct showing intent to abandon, does not end an express easement."
    C: "No, because Rook's planting of the shrubs terminated the easement by adverse use."
    D: "No, because an easement in gross ends when its holder stops using it."
  answer: B
  explanation_correct: >-
    B is correct. An easement ends by abandonment only when nonuse is coupled with conduct showing an intent to give
    it up (R-PRP-068). Quill simply stopped using the path while he worked overseas and did nothing indicating an
    intent to abandon. Rook's shrubs could terminate the easement by prescription only after adverse blocking for the
    full ten-year period, and they have been in place only since 2023. Quill may use the path and can seek removal of
    the shrubs.
  explanation_each_wrong_option:
    A: >-
      Wrong standard. Nonuse for any length of time does not by itself abandon an express easement (R-PRP-068).
      California's statute extinguishing an easement acquired by use after five years of nonuse (Civ. Code section
      811) concerns prescriptive easements and does not apply on the MBE.
    C: >-
      Termination by prescription requires the servient owner's adverse interference for the full statutory period;
      a few years of shrubs is not enough (R-PRP-068).
    D: >-
      The path benefits Quill's house, so the easement is appurtenant, not in gross; and nonuse alone ends neither
      kind (R-PRP-060, R-PRP-068).
  trap_type: wrong-standard
  authority: ["Common law: termination of easements by abandonment and by prescription"]
  source: original
  tags: [wave1, M4, easements, termination]
  status: draft
  last_verified: 2026-11-04

- id: Q-PRP-0020
  subject: PRP
  coverage_ids: [PRP-MBE-II.C]
  rule_ids: [R-PRP-069, R-PRP-032]
  difficulty: 1
  stem: >-
    Fern leased a storefront to Gio for a bakery for six years; the lease said nothing about fixtures. Gio bolted two
    commercial ovens and a walk-in cooler to the floor and connected them to the building's gas and electric lines.
    Three weeks before the lease ended, Gio began unbolting the equipment to move it to his new location, intending
    to cap the lines and patch the bolt holes. Fern sued to stop the removal, claiming that the equipment had become
    part of the building.
  call: "Who is likely to prevail?"
  options:
    A: "Fern, because the equipment was bolted to the floor and connected to the building's utilities, making it part of the realty."
    B: "Fern, because the lease did not give Gio the right to remove anything he attached to the premises."
    C: "Gio, because a chattel installed by a tenant never becomes a fixture."
    D: "Gio, because a tenant may remove trade fixtures before the lease ends if he repairs the damage that removal causes."
  answer: D
  explanation_correct: >-
    D is correct. As between landlord and tenant, equipment a tenant installs for use in its business is a trade
    fixture that the tenant may remove before the lease ends, provided it repairs any damage caused by the removal
    (R-PRP-069, R-PRP-032). Gio installed the ovens and cooler for his bakery, is removing them three weeks before the
    term ends, and plans to cap the lines and patch the bolt holes.
  explanation_each_wrong_option:
    A: >-
      Attachment and adaptation decide fixture status between vendor and purchaser or mortgagor and mortgagee.
      Between landlord and tenant, the trade-fixture rule lets the tenant remove business equipment despite
      attachment (R-PRP-069).
    B: >-
      A tenant's right to remove trade fixtures exists unless the lease takes it away; a lease that is silent leaves
      the right intact (R-PRP-069).
    C: >-
      Right result, wrong reason, and overbroad. Tenant-installed items can become fixtures, and trade fixtures left
      after the lease ends can pass to the landlord; the point is that trade fixtures may be removed during the term
      (R-PRP-069).
  trap_type: confused-rule
  authority: ["Common law: trade fixtures"]
  source: original
  tags: [wave1, M4, fixtures]
  status: draft
  last_verified: 2026-11-04

- id: Q-PRP-0021
  subject: PRP
  coverage_ids: [PRP-MBE-II.D.2]
  rule_ids: [R-PRP-071, R-PRP-073]
  difficulty: 1
  stem: >-
    Since 1998, Ulla has operated an auto-repair shop on her lot. In 2019 the city rezoned the area for single-family
    residences only; the new ordinance allows existing lawful uses to continue. In 2025 Ulla applied for a permit to
    build a second service bay and a car wash on the vacant half of her lot, which would double the shop's capacity.
    The city denied the permit, and Ulla sued.
  call: "Is the court likely to uphold the denial?"
  options:
    A: "No, because Ulla's right to use the lot for auto repair was protected when the zoning changed, so she may develop the whole lot for that use."
    B: "No, because the denial deprives Ulla of the economic value of her vacant land and is therefore a taking."
    C: "Yes, because a nonconforming use must cease as soon as the new zoning ordinance takes effect."
    D: "Yes, because a nonconforming use may continue but may not be substantially expanded."
  answer: D
  explanation_correct: >-
    D is correct. A use that was lawful before a zoning change may continue as a nonconforming use, but it may not be
    substantially expanded or changed (R-PRP-071). Adding a second service bay and a car wash on previously unused
    land, doubling the shop's capacity, is a substantial expansion, so the city may deny the permit.
  explanation_each_wrong_option:
    A: >-
      Overbroad. Nonconforming-use protection preserves the use as it existed when the zoning changed; it does not
      authorize expanding it onto the vacant part of the lot (R-PRP-071).
    B: >-
      Wrong standard. A regulation is a categorical taking only if it deprives the land of all economically
      beneficial use (Lucas; R-PRP-073). Ulla keeps a working repair shop on her lot.
    C: >-
      The ordinance itself allows existing uses to continue; and where a government does phase out a nonconforming
      use, it must allow a reasonable amortization period, not demand immediate cessation (R-PRP-071).
  trap_type: overbroad
  authority: ["Common law: nonconforming uses", "Lucas v. South Carolina Coastal Council, 505 U.S. 1003 (1992)"]
  source: original
  tags: [wave1, M4, zoning]
  status: draft
  last_verified: 2026-11-04
