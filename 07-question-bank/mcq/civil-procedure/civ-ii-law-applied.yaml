# Civil Procedure — NCBE category II: Law applied by federal courts (wave 1, original items)
questions:
- id: Q-CIV-0016
  subject: CIV
  coverage_ids: [CIV-MBE-II.A]
  rule_ids: [R-CIV-040, R-CIV-038, R-CIV-029]
  difficulty: 2
  stem: >-
    Moreau, a citizen of State A, sued Grantham, a citizen of State B, in federal court in State A for
    negligence under State A law, seeking $250,000. State A's two-year limitations period applies, and a
    State A statute provides that an action is not "commenced" for limitations purposes until the
    defendant is served. Moreau filed her complaint one week before the two-year period expired but
    did not serve Grantham until three weeks after it expired, well within the 90 days allowed by
    Rule 4(m). Grantham moved for summary judgment on limitations grounds. Moreau relies on Federal
    Rule 3, which provides that a civil action is commenced by filing a complaint.
  call: "How should the court rule on the motion?"
  options:
    A: "Deny it, because Rule 3 is a valid Federal Rule on point, so under Hanna it controls over the conflicting state statute on when an action is commenced."
    B: "Grant it, because state law determines when a state-law action is commenced for limitations purposes, and Rule 3 does not address that question."
    C: "Deny it, because Moreau served Grantham within the 90 days allowed by Rule 4(m)."
    D: "Grant it, because a federal court in a diversity case must apply every state rule that could affect the outcome of the litigation, including procedural rules."
  answer: B
  explanation_correct: >-
    In diversity, federal courts apply state limitations law, including the State's rule on when an
    action is commenced for limitations purposes (R-CIV-040; Walker v. Armco Steel; Guaranty Trust v.
    York). Rule 3 governs the start of the federal action for purposes of the Federal Rules' own
    timetables; it was not intended to toll state limitations periods, so there is no direct collision
    and the Hanna analysis for a Rule on point (R-CIV-038) does not apply. Moreau's claim is
    time-barred. Trap: reading Rule 3 as broader than it is.
  explanation_each_wrong_option:
    A: >-
      Walker holds that Rule 3 is not broad enough to control state limitations tolling, so it does not
      displace the state service requirement.
    C: >-
      Rule 4(m) (R-CIV-029) sets a deadline for service in the federal action; it does not extend a
      state limitations period.
    D: >-
      Overbroad. When a valid Federal Rule truly covers the issue, it governs even if the outcome
      differs (Hanna); the outcome test applies only when no federal rule is on point.
  trap_type: confused-rule
  authority: ["Walker v. Armco Steel Corp., 446 U.S. 740 (1980)", "Guaranty Trust Co. v. York, 326 U.S. 99 (1945)", "FRCP 3"]
  source: original
  tags: [wave1, M1, erie, limitations]
  status: draft
  last_verified: 2026-11-04

- id: Q-CIV-0017
  subject: CIV
  coverage_ids: [CIV-MBE-II.A]
  rule_ids: [R-CIV-038, R-CIV-037, R-CIV-029]
  difficulty: 2
  stem: >-
    A State C statute requires that in any action for defamation, the summons and complaint be
    delivered in hand to the defendant personally, and it forbids leaving them at the defendant's home
    with another person. Federal Rule 4(e)(2)(B) permits service by leaving the papers at the
    individual's dwelling with someone of suitable age and discretion who resides there. Ingram sued
    Bode for defamation in federal court in State C under diversity jurisdiction, and served Bode by
    leaving the papers with Bode's adult son at the home where both live. Bode moved to dismiss for
    insufficient service, arguing that state law governs because service rules can change the outcome
    of a case.
  call: "How should the court rule on the motion?"
  options:
    A: "Grant it, because ignoring the state rule would be outcome-determinative and would encourage forum shopping by defamation plaintiffs who could choose federal court."
    B: "Grant it, because the manner of service is a matter of substantive state law in diversity cases, at least where the State has a special rule for the claim."
    C: "Deny it, but only because Bode actually received the papers."
    D: "Deny it, because Rule 4 directly governs the manner of service and is a valid exercise of the rulemaking power, so it controls over the state rule."
  answer: D
  explanation_correct: >-
    When a Federal Rule of Civil Procedure is sufficiently broad to cover the point in dispute and is
    valid under the Rules Enabling Act, the federal court applies it regardless of contrary state law
    (R-CIV-038; Hanna v. Plumer; 28 U.S.C. § 2072). Rule 4(e)(2)(B) directly addresses how an individual
    may be served and really regulates procedure. Service on Bode's adult son, who lives in the home,
    complied with it (R-CIV-029). Trap: applying the York/Erie outcome test when a valid Rule is on
    point.
  explanation_each_wrong_option:
    A: >-
      The outcome-determinative and twin-aims analysis (R-CIV-037, R-CIV-039) is used only when no
      valid federal rule or statute covers the issue.
    B: >-
      The manner of serving process in federal court is procedural and governed by Rule 4.
    C: >-
      Right result, wrong reason. Service is valid because it complied with Rule 4, not because of
      actual notice.
  trap_type: wrong-standard
  authority: ["Hanna v. Plumer, 380 U.S. 460 (1965)", "28 U.S.C. § 2072", "FRCP 4(e)(2)(B)"]
  source: original
  tags: [wave1, M1, erie, hanna]
  status: draft
  last_verified: 2026-11-04

- id: Q-CIV-0018
  subject: CIV
  coverage_ids: [CIV-MBE-II.A, CIV-MBE-IV.A]
  rule_ids: [R-CIV-039, R-CIV-040, R-CIV-078]
  difficulty: 3
  stem: >-
    Sutter sued Grove Mall Inc. in federal court under diversity jurisdiction for injuries from a fall
    in the mall's parking garage, claiming damages under State D premises-liability law. Under State D
    law, the duty owed depends on whether the plaintiff was an invitee or a trespasser. Although no State
    D statute addresses the point and the practice is not part of the definition of the parties'
    rights, State D courts have long had the judge rather than the jury decide disputed facts about a
    plaintiff's status. The facts about Sutter's status are disputed, and Sutter has timely demanded a
    jury.
  call: "Who should decide the disputed facts about Sutter's status?"
  options:
    A: "The jury, because federal law governs the allocation of fact-finding between judge and jury in federal court, reflecting the federal policy of the Seventh Amendment."
    B: "The judge, because a federal court in a diversity case must follow a state practice whenever ignoring it might change the outcome and encourage forum shopping between courts."
    C: "The judge, because the standard of care owed to a trespasser or an invitee is a matter of State D substantive law, and Sutter's status determines which standard applies."
    D: "The jury, but only if State D's legislature has expressly provided a jury right for premises-liability claims."
  answer: A
  explanation_correct: >-
    Where no Federal Rule governs and the state practice is a form-and-mode rule not bound up with
    state-created rights, the federal court weighs Erie's concerns against countervailing federal
    interests; the federal system's allocation of fact-finding to the jury, reflecting the Seventh
    Amendment, outweighs a state practice of judge fact-finding (R-CIV-039; Byrd v. Blue Ridge Rural
    Electric Cooperative). The right to and role of a jury in federal court is a matter of federal law
    (R-CIV-040, R-CIV-078). The state duty rules still supply the substantive standard the jury applies.
    Trap: applying the outcome test mechanically.
  explanation_each_wrong_option:
    B: >-
      Byrd rejects the pure outcome test where the state rule is procedural in form and a strong federal
      interest, the jury's role, is at stake.
    C: >-
      The standard of care is substantive and comes from State D law, but who finds the facts in
      federal court is a federal question.
    D: >-
      The jury right in federal court comes from the Seventh Amendment and federal law, not from state
      legislation.
  trap_type: wrong-standard
  authority: ["Byrd v. Blue Ridge Rural Electric Cooperative, Inc., 356 U.S. 525 (1958)", "U.S. Const. amend. VII", "Simler v. Conner, 372 U.S. 221 (1963)"]
  source: original
  tags: [wave1, M1, erie, byrd, judge-jury]
  status: draft
  last_verified: 2026-11-04

- id: Q-CIV-0019
  subject: CIV
  coverage_ids: [CIV-MBE-II.B]
  rule_ids: [R-CIV-041, R-CIV-037]
  difficulty: 2
  stem: >-
    The United States Treasury issued a check to Mills, a federal contractor, for work performed under a
    federal contract. A thief stole the check, forged Mills's endorsement, and cashed it at Carver
    Bank, which collected payment from the Federal Reserve. Months later the government discovered the
    forgery and sued Carver Bank in federal court to recover the amount of the check. Carver Bank argues
    that, under the law of the State where it is located, the government's delay in giving notice of
    the forgery bars recovery.
  call: "Which law governs the government's rights on the check?"
  options:
    A: "The law of the State where the check was cashed, under the Erie doctrine, because there is no federal general common law and no federal statute applies."
    B: "The law of the State where Mills resided, because Mills was the named payee."
    C: "Federal common law, because the rights and duties of the United States on commercial paper it issues involve uniquely federal interests."
    D: "A version of the Uniform Commercial Code that Congress enacted to govern commercial paper issued in federal transactions."
  answer: C
  explanation_correct: >-
    Although there is no federal general common law (Erie, R-CIV-037), federal courts create federal
    common law in enclaves of uniquely federal interest. The rights and duties of the United States on
    commercial paper it issues are governed by federal law, because the government's vast issuance of
    such paper requires a uniform rule (R-CIV-041; Clearfield Trust Co. v. United States). The court
    applies a federal rule, not the bank's State's notice rule. Trap: applying Erie reflexively.
  explanation_each_wrong_option:
    A: >-
      Erie governs state-law claims; the government's rights on its own commercial paper are a recognized
      federal-common-law enclave.
    B: >-
      The payee's residence does not determine the governing law; the federal interest in uniformity
      does.
    D: >-
      No such federal statute exists; the governing rules come from federal common law.
  trap_type: confused-rule
  authority: ["Clearfield Trust Co. v. United States, 318 U.S. 363 (1943)", "Erie R.R. v. Tompkins, 304 U.S. 64 (1938)"]
  source: original
  tags: [wave1, M1, federal-common-law]
  status: draft
  last_verified: 2026-11-04
