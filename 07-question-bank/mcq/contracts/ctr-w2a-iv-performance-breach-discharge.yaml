- id: Q-CTR-0087
  subject: CTR
  coverage_ids: [CTR-MBE-IV.G]
  rule_ids: [R-CTR-084, R-CTR-082, R-CTR-083]
  difficulty: 2
  stem: >-
    Quintero rented the rooftop terrace of the Bayview Hotel for the evening of July 4 for $12,000,
    four times the terrace's normal evening rate. The written contract stated that the terrace was
    rented "for a private party to view the city's Independence Day fireworks over the harbor," and the
    terrace is known as the best place in the city to see them. Two days before the event, an
    accidental explosion destroyed the barge carrying the fireworks, and the city cancelled the show for
    the year. Quintero promptly notified the hotel that she would not use the terrace. The terrace
    remained available, and the hotel sued Quintero for the $12,000.
  call: "Is Quintero likely to be liable?"
  options:
    A: "No, because her principal purpose, known to both parties, was substantially frustrated."
    B: "Yes, because the terrace remained available on July 4, so the hotel's performance was not impossible."
    C: "Yes, but only for $3,000, the terrace's normal rental value for one evening."
    D: "No, because the cancellation of the fireworks show made Quintero's performance of the contract impracticable."
  answer: A
  explanation_correct: >-
    Where, after contracting, a party's principal purpose is substantially frustrated without its fault
    by an event whose non-occurrence was a basic assumption on which the contract was made, its
    remaining duties are discharged (R2d § 265; R-CTR-084). The contract itself stated the purpose, the
    premium price reflected it, and an accident that neither party caused eliminated it. The terrace was
    still usable, but renting it had lost its value for the purpose both parties understood. Trap:
    demanding impossibility when the doctrine is frustration.
  explanation_each_wrong_option:
    B: >-
      Confuses impossibility (R-CTR-082) with frustration. Frustration applies precisely when
      performance remains possible but its value to one party has been destroyed.
    C: >-
      Frustration discharges Quintero's remaining duty entirely; there is no rule reducing the price to
      the market rate.
    D: >-
      Right result, wrong doctrine. Quintero's performance, paying money, remained entirely practicable
      (R-CTR-083); what was destroyed was the purpose of the exchange.
  trap_type: confused-rule
  authority: ["R2d § 265"]
  source: original
  tags: [wave2, frustration-of-purpose]
  status: draft
  last_verified: 2026-11-04

- id: Q-CTR-0088
  subject: CTR
  coverage_ids: [CTR-MBE-IV.H]
  rule_ids: [R-CTR-088, R-CTR-116]
  difficulty: 1
  stem: >-
    Brewer borrowed $40,000 from Lyle, repayable in one year. Six months later, Brewer, Lyle and Moss
    signed an agreement under which Moss promised Lyle to repay the loan when due, and Lyle stated that
    he "releases Brewer from all liability on the loan and accepts Moss as the sole debtor." When the
    loan came due, Moss did not pay. Lyle sued Brewer for $40,000.
  call: "Is Lyle likely to recover from Brewer?"
  options:
    A: "Yes, because a debtor who delegates its duty to pay to another person remains liable to the creditor until the debt is paid."
    B: "No, because the agreement was a novation that discharged Brewer."
    C: "Yes, because Lyle received no consideration for releasing Brewer."
    D: "No, but only because Lyle must first sue Moss and fail to collect."
  answer: B
  explanation_correct: >-
    A novation is a substituted contract that brings in a new party, usually a new obligor, and with
    the obligee's assent immediately discharges the original obligor (R2d § 280; R-CTR-088). All three
    parties signed an agreement in which Lyle accepted Moss as sole debtor and expressly released
    Brewer. Brewer was discharged when the agreement was made, so Lyle's remedy is against Moss alone.
    Trap: treating a novation as a mere delegation.
  explanation_each_wrong_option:
    A: >-
      That is the rule for a delegation the obligee has not agreed to treat as a release (R-CTR-116).
      Here the obligee expressly released Brewer.
    C: >-
      Moss's promise to pay Lyle was consideration for Lyle's release of Brewer; the new obligor's
      promise supports the substitution.
    D: >-
      Lyle has no claim against Brewer at all. Brewer was discharged outright, so there is no
      secondary liability waiting on a suit against Moss.
  trap_type: confused-rule
  authority: ["R2d § 279", "R2d § 280"]
  source: original
  tags: [wave2, discharge, novation]
  status: draft
  last_verified: 2026-11-04
