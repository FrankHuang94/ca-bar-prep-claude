# Criminal Law and Procedure — NCBE category IV: general principles
# Original MBE-style items (wave 1). Majority common-law rules unless the stem names the MPC or a statute.
questions:
- id: Q-CRM-0019
  subject: CRM
  coverage_ids: [CRM-MBE-IV.A]
  rule_ids: [R-CRM-003, R-CRM-002, R-CRM-037]
  difficulty: 2
  stem: >-
    While walking along a crowded pier, a man accidentally bumped into a stranger, who fell into deep water.
    The man saw that the stranger could not swim and was struggling. A life ring hung on a post within arm's
    reach of the man, and throwing it would have posed no risk to him. He walked away without doing
    anything, and the stranger drowned. The man is charged with involuntary manslaughter.
  call: "Can the man properly be convicted?"
  options:
    A: "No, because there is no legal duty to rescue a stranger, even when the rescue could be made at no risk."
    B: "No, because the bump was accidental, so the man committed no voluntary criminal act on which liability could rest."
    C: "Yes, because by innocently creating the peril he came under a legal duty to take reasonable steps to aid the stranger."
    D: "Yes, because every person has a legal duty to aid anyone in danger when aid can be given without risk, as it could be here."
  answer: C
  explanation_correct: >-
    C is correct. An omission is criminal only if the defendant had a legal duty to act, knew the facts
    creating the duty and could reasonably perform it (R-CRM-003). One source of duty is the defendant's own
    creation of the peril, even if he created it innocently. He knew the stranger was drowning, could have
    thrown the ring at no risk, and walked away; that gross failure supports involuntary manslaughter
    (R-CRM-037).
  explanation_each_wrong_option:
    A: >-
      Exception trap. The no-duty-to-rescue rule governs bystanders who did not create the danger; one who
      creates the peril, even innocently, has a duty, and the man's own conduct put the stranger in the
      water (R-CRM-003).
    B: >-
      Liability rests on the omission after the bump, not on the bump. A failure to perform a legal duty one
      is physically able to perform satisfies the act requirement (R-CRM-002).
    D: >-
      Overbroad. There is no general legal duty to rescue, even at no risk; a duty must arise from statute,
      contract, relationship, voluntary assumption or creation of the peril (R-CRM-003).
  trap_type: exception-trap
  authority: ["Common law", "MPC § 2.01(3)", "Jones v. United States, 308 F.2d 307 (D.C. Cir. 1962)"]
  source: original
  tags: [wave1, omissions, duty-to-act]
  status: verified
  last_verified: "2026-11-05"

- id: Q-CRM-0020
  subject: CRM
  coverage_ids: [CRM-MBE-IV.B.1]
  rule_ids: [R-CRM-005, R-CRM-010, R-CRM-011, R-CRM-006]
  difficulty: 3
  stem: >-
    A statute provides: "It is a felony to knowingly transport any bird of an endangered species." The
    jurisdiction follows the Model Penal Code's culpability provisions. A pet-shop owner drove a crate of
    parrots across the state for sale. One parrot belonged to an endangered subspecies that looks almost
    identical to a common species, and the owner honestly and reasonably believed that all of the birds were
    of the common species. He knew that transporting endangered birds was illegal.
  call: "Is the owner guilty?"
  options:
    A: "No, because the statute's knowledge requirement applies to the fact that the bird belonged to an endangered species."
    B: "Yes, because his mistake about the bird's legal status is a mistake of law, and ignorance of the law is no excuse."
    C: "Yes, because wildlife-protection statutes are public-welfare offenses that impose strict liability."
    D: "No, because his honest and reasonable mistake of fact is a defense to every crime, whatever mental state the statute requires."
  answer: A
  explanation_correct: >-
    A is correct. Under the MPC, when a statute states a culpability term without distinguishing among the
    elements, that term applies to every material element (MPC § 2.02(4); R-CRM-005). "Knowingly"
    therefore applies both to transporting and to the bird's being of an endangered species. A mistake of
    fact that negates the required knowledge is a defense (R-CRM-010). The owner did not know the bird was
    endangered, so he lacked the required knowledge.
  explanation_each_wrong_option:
    B: >-
      Confused rule. His mistake was about a fact (which species the bird was), not about the law; he knew
      the law forbade transporting endangered birds (R-CRM-011).
    C: >-
      The legislature expressly required knowledge, so the offense is not strict liability; strict liability
      is inferred mainly from silent public-welfare statutes with light penalties (R-CRM-006).
    D: >-
      Overbroad. Mistake of fact is a defense only if it negates a required mental state; it is no defense to
      a strict-liability element (R-CRM-010).
  trap_type: confused-rule
  authority: ["MPC §§ 2.02(4), 2.04(1)"]
  source: original
  tags: [wave1, mens-rea, mpc-culpability, mistake-of-fact]
  status: verified
  last_verified: "2026-11-05"

- id: Q-CRM-0021
  subject: CRM
  coverage_ids: [CRM-MBE-II.E, CRM-MBE-IV.B.2]
  rule_ids: [R-CRM-055, R-CRM-006, R-CRM-010]
  difficulty: 1
  stem: >-
    A statute makes it a felony to have sexual intercourse with a person under the age of 16; it says
    nothing about the defendant's knowledge of the person's age. A 19-year-old man met a girl at a club
    that admitted only patrons 21 and older. She showed him a realistic driver's license stating that she
    was 22, and she appeared to be in her twenties. They had consensual intercourse. She was in fact 15. The
    jurisdiction follows the majority approach to this offense.
  call: "Should the man be convicted?"
  options:
    A: "No, because his honest and reasonable mistake about her age negates the required criminal intent."
    B: "No, because she consented to the intercourse."
    C: "Yes, because he was negligent in failing to verify her age more carefully."
    D: "Yes, because the offense imposes strict liability as to the victim's age."
  answer: D
  explanation_correct: >-
    D is correct. Under the majority rule, statutory rape is a strict-liability offense as to the victim's
    age: neither the minor's consent nor a reasonable mistake about her age is a defense (R-CRM-055;
    R-CRM-006). Because no mental state is required as to age, his careful-seeming belief is irrelevant.
  explanation_each_wrong_option:
    A: >-
      Exception trap. Mistake of fact defeats only a mental state the crime requires; for a strict-liability
      element there is none to negate (R-CRM-010). (The MPC and some states allow a reasonable-mistake
      defense; the majority does not.)
    B: >-
      A minor's consent is legally ineffective; the absence of consent is not an element of statutory rape
      (R-CRM-055).
    C: >-
      Right result, wrong reason. Conviction does not depend on negligence; strict liability requires no
      fault as to age at all (R-CRM-006).
  trap_type: exception-trap
  authority: ["Common law", "MPC §§ 2.05, 213.6(1)"]
  source: original
  tags: [wave1, strict-liability, statutory-rape]
  status: verified
  last_verified: "2026-11-05"

- id: Q-CRM-0022
  subject: CRM
  coverage_ids: [CRM-MBE-IV.B.3]
  rule_ids: [R-CRM-011]
  difficulty: 1
  stem: >-
    A bar owner wanted to install an electronic "sweepstakes" machine. Before doing so, he paid a licensed
    attorney for a written opinion, which concluded that the machine was not a "gambling device" under state
    law. Relying on the opinion, he installed and operated the machine for profit. A state statute makes it a
    misdemeanor to "operate any slot machine or other gambling device for profit." The machine is in fact a
    gambling device under the statute, and no court or official had ever stated otherwise.
  call: "Does the owner have a valid defense?"
  options:
    A: "Yes, because he reasonably relied on a written opinion from a licensed attorney that the machine was not a gambling device."
    B: "Yes, because he believed in good faith that his conduct was lawful and so did not intend to violate the law."
    C: "No, because reliance on a private attorney's advice is not reliance on an official statement of the law."
    D: "No, because a mistake of law can never be a defense, no matter how reasonable the defendant's belief was."
  answer: C
  explanation_correct: >-
    C is correct. Mistake of law is generally no defense. Reasonable reliance excuses only when the
    defendant relied on an official statement of the law, such as a statute, a judicial decision, an
    administrative order or an interpretation by the official charged with interpreting the law, that is
    later found erroneous (R-CRM-011). A private lawyer's opinion is not an official statement.
  explanation_each_wrong_option:
    A: >-
      Confused rule. Good-faith reliance on private counsel, however reasonable, does not satisfy the
      official-statement exception (R-CRM-011).
    B: >-
      The statute does not require knowledge that the conduct is illegal; intent to violate the law is
      not an element (R-CRM-011).
    D: >-
      Overbroad. Mistake of law excuses in narrow cases: reliance on an official statement, a law not
      reasonably made available, or a mistake that negates a legal element of the offense (R-CRM-011).
  trap_type: confused-rule
  authority: ["Common law", "MPC § 2.04(3)", "Cheek v. United States, 498 U.S. 192 (1991)"]
  source: original
  tags: [wave1, mistake-of-law]
  status: verified
  last_verified: "2026-11-05"

- id: Q-CRM-0023
  subject: CRM
  coverage_ids: [CRM-MBE-IV.C.1]
  rule_ids: [R-CRM-015, R-CRM-018]
  difficulty: 1
  stem: >-
    A man with severe bipolar disorder set fire to his former employer's warehouse during a manic episode.
    At his arson trial, psychiatrists for both sides agree that he understood that he was setting a fire and
    knew that doing so was illegal and morally wrong, but that his illness made him unable to resist the
    impulse. The jurisdiction uses only the M'Naghten test for insanity.
  call: "Should the jury find him not guilty by reason of insanity?"
  options:
    A: "Yes, because a mental disease prevented him from conforming his conduct to the requirements of law."
    B: "No, because he knew the nature and quality of his act and knew that it was wrong."
    C: "Yes, because he suffered from a severe mental disease at the time of the fire."
    D: "No, because insanity is a defense only to specific-intent crimes, and arson is not a specific-intent crime."
  answer: B
  explanation_correct: >-
    B is correct. Under M'Naghten, a defendant is legally insane only if, because of a disease of the mind,
    he did not know the nature and quality of his act or did not know it was wrong (R-CRM-015). The
    undisputed evidence is that he knew both. Inability to control an impulse is a volitional incapacity
    that M'Naghten does not recognize.
  explanation_each_wrong_option:
    A: >-
      Wrong test. Lack of capacity to conform conduct to law is the volitional prong of the irresistible
      impulse and MPC tests, which this jurisdiction does not use (R-CRM-015).
    C: >-
      Missing element. A mental disease is necessary but not sufficient; it must produce the cognitive
      incapacity M'Naghten requires (R-CRM-015).
    D: >-
      Confused rule. The specific-intent limitation applies to voluntary intoxication (R-CRM-018); insanity
      is a defense to any crime.
  trap_type: confused-rule
  authority: ["M'Naghten's Case (1843)", "MPC § 4.01"]
  source: original
  tags: [wave1, insanity, mnaghten]
  status: verified
  last_verified: "2026-11-05"

- id: Q-CRM-0024
  subject: CRM
  coverage_ids: [CRM-MBE-IV.C.2, CRM-MBE-IV.B.1]
  rule_ids: [R-CRM-018, R-CRM-004, R-CRM-010, R-CRM-044, R-CRM-053]
  difficulty: 1
  stem: >-
    After drinking heavily at a party, a man picked up a leather jacket from a pile of coats and walked out
    with it, believing in his drunken state that it was his own; in fact it belonged to another guest, and
    his own jacket looked nothing like it. When the owner followed him outside and grabbed his arm, the man
    punched him in the face. The man is charged with larceny of the jacket and battery of the owner. The
    jurisdiction follows the common law.
  call: "As to which charge, if either, can the man's voluntary intoxication provide a defense?"
  options:
    A: "Both charges, because his intoxication prevented him from acting with any criminal intent."
    B: "Larceny only, because it requires a specific intent to permanently deprive the owner of the property."
    C: "Battery only, because he did not form an intent to harm the owner while intoxicated."
    D: "Neither charge, because voluntary intoxication is never a defense."
  answer: B
  explanation_correct: >-
    B is correct. Voluntary intoxication is a defense only to specific-intent crimes, and only if it
    prevented the defendant from forming the required intent (R-CRM-018). Larceny requires the specific
    intent to permanently deprive another of his property (R-CRM-004, R-CRM-044); a man who honestly
    believed he was taking his own jacket lacked that intent, even if his belief was unreasonable
    (R-CRM-010). Battery is a general-intent crime, so voluntary intoxication is no defense to it
    (R-CRM-053).
  explanation_each_wrong_option:
    A: >-
      Overbroad. Intoxication negates only specific intent; general-intent and malice crimes such as battery
      are unaffected (R-CRM-018).
    C: >-
      Reversed. Battery is general intent, and voluntary intoxication does not excuse it (R-CRM-018,
      R-CRM-053).
    D: >-
      Overbroad. At common law voluntary intoxication can negate a specific intent (R-CRM-018), though a
      state may abolish the defense by statute (Montana v. Egelhoff, plurality opinion, with a fifth Justice
      concurring in the judgment); this jurisdiction follows the common law.
  trap_type: overbroad
  authority: ["Common law", "MPC § 2.08", "Montana v. Egelhoff, 518 U.S. 37 (1996) (plurality opinion)"]
  source: original
  tags: [wave1, intoxication, specific-intent]
  status: verified
  last_verified: "2026-11-05"

- id: Q-CRM-0025
  subject: CRM
  coverage_ids: [CRM-MBE-IV.D]
  rule_ids: [R-CRM-013, R-CRM-012]
  difficulty: 2
  stem: >-
    During a robbery, a man stabbed a store owner in the abdomen. The owner was taken to a hospital, where a
    surgeon repaired the wound but negligently failed to notice a small nicked artery. The owner died of
    internal bleeding two days later. Medical experts agree that with proper care the owner would have
    survived. The man is charged with murder and argues that the surgeon's negligence, not the stabbing,
    caused the death.
  call: "Is the man's argument likely to succeed?"
  options:
    A: "Yes, because the owner would have survived but for the surgeon's negligence, so the stabbing was not the cause of death."
    B: "Yes, because a doctor's negligence is an independent intervening cause that breaks the chain of causation between the stabbing and the death."
    C: "No, because the owner would not have needed surgery but for the stabbing, and that alone establishes causation."
    D: "No, because ordinary negligence in treating a wound is foreseeable and does not relieve the man of responsibility for the death."
  answer: D
  explanation_correct: >-
    D is correct. The defendant must be both the actual and the proximate cause of death (R-CRM-012,
    R-CRM-013). The stabbing is an actual cause, and ordinary negligence in treating a wound is a
    foreseeable, dependent intervening cause that does not break the chain of proximate causation. Only an
    unforeseeable, independent cause, such as grossly reckless treatment that is the sole cause of death,
    would do so.
  explanation_each_wrong_option:
    A: >-
      There can be more than one but-for cause. The surgeon's negligence was a cause, but that does not
      erase the stabbing as a cause (R-CRM-012).
    B: >-
      Confused rule. Medical negligence responding to the defendant's harm is a dependent intervening cause
      and is foreseeable (R-CRM-013).
    C: >-
      Right result, wrong reason. But-for causation alone is not enough; the prosecution must also show
      proximate cause, which exists because the negligence was foreseeable (R-CRM-013).
  trap_type: right-result-wrong-reason
  authority: ["Common law", "MPC § 2.03"]
  source: original
  tags: [wave1, causation, intervening-cause]
  status: verified
  last_verified: "2026-11-05"

- id: Q-CRM-0026
  subject: CRM
  coverage_ids: [CRM-MBE-IV.E]
  rule_ids: [R-CRM-020, R-CRM-021, R-CRM-023]
  difficulty: 2
  stem: >-
    In a parking garage, a stranger rushed at a woman with a large knife, shouting that he would kill her.
    The woman could have escaped safely by stepping into an elevator whose doors were open beside her.
    Instead she drew a pistol she was licensed to carry and shot the stranger, killing him. She is charged
    with murder. The jurisdiction has no statute on the subject and follows the majority rule on retreat.
  call: "Is she likely to be acquitted?"
  options:
    A: "Yes, because she reasonably believed she faced imminent deadly force and had no duty to retreat."
    B: "No, because she could have retreated in complete safety before using deadly force."
    C: "No, but she should be convicted only of voluntary manslaughter because she used more force than necessary."
    D: "Yes, because a person may use deadly force against anyone who attacks her."
  answer: A
  explanation_correct: >-
    A is correct. A person may use deadly force when she reasonably believes it necessary to prevent
    imminent death or serious bodily injury (R-CRM-020). A man charging with a knife and threatening to kill
    supplies that belief. Under the majority rule, a non-aggressor need not retreat before using deadly
    force, even if she could do so safely (R-CRM-021).
  explanation_each_wrong_option:
    B: >-
      Minority rule. A duty to retreat when it can be done in complete safety applies in a minority of
      jurisdictions and under the MPC, not under the majority rule (R-CRM-021).
    C: >-
      Imperfect self-defense applies to an honest but unreasonable belief in the need for deadly force
      (R-CRM-023); her belief was reasonable and her force proportional.
    D: >-
      Overbroad. Deadly force is justified only against a threat of death or serious bodily injury, not
      against any attack (R-CRM-020).
  trap_type: minority-rule
  authority: ["Common law", "MPC § 3.04(2)(b)"]
  source: original
  tags: [wave1, self-defense, duty-to-retreat]
  status: verified
  last_verified: "2026-11-05"
