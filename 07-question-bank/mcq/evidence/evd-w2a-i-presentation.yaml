- id: Q-EVD-0062
  subject: EVD
  coverage_ids: [EVD-MBE-I.D.9]
  rule_ids: [R-EVD-033, R-EVD-027, R-EVD-022]
  difficulty: 3
  stem: >-
    In a federal negligence action arising from a collision between a city bus and a delivery van, a
    pedestrian testifies for the plaintiff that she saw the van run a red light while she was waiting at
    the bus stop on that corner. She adds that she had just bought a coffee at a cafe two doors away. On
    cross-examination she repeats that she bought coffee at that cafe that morning. The defendant then
    offers testimony from the cafe's manager that the cafe was closed all that day for a plumbing repair.
    The defendant does not dispute that the pedestrian was at the bus stop when the collision occurred. The
    plaintiff objects.
  call: How should the court most likely rule on the objection?
  options:
    A: "Overrule it, because any evidence that contradicts a witness's testimony bears on her credibility."
    B: "Overrule it, because a party may always prove that a witness testified falsely under oath."
    C: "Sustain it, because whether the cafe was open is a collateral matter on which extrinsic contradiction is not allowed."
    D: "Sustain it, because the defendant did not first give the pedestrian an opportunity to explain or deny the contradiction."
  answer: C
  explanation_correct: >-
    Contradiction (R-EVD-033): a witness may always be contradicted on cross-examination, but extrinsic
    evidence of contradiction is allowed only on a non-collateral matter, meaning one relevant to a
    substantive issue or independently admissible to impeach (such as bias or capacity). Whether the cafe
    was open has no bearing on whether she saw the light, and her presence at the corner is undisputed; the
    manager's testimony would only show a mistake about a side detail. The collateral-matter limit, an
    application of FRE 403 and 611(a), lets the court exclude it to avoid a sideshow. The defendant was
    limited to its cross-examination.
  explanation_each_wrong_option:
    A: >-
      Overbroad. Only non-collateral contradictions may be proved by extrinsic evidence.
    B: >-
      No such rule exists. Extrinsic proof of a witness's specific lies, offered only to show untruthfulness,
      is barred by FRE 608(b) (R-EVD-027) and the collateral-matter limit.
    D: >-
      Confused rule. The opportunity-to-explain-or-deny foundation comes from FRE 613(b) (R-EVD-023) and
      governs extrinsic proof of a witness's prior inconsistent statement, not contradiction by another
      witness's account of the facts. In any event, no foundation would make extrinsic contradiction on a
      collateral matter admissible.
  trap_type: overbroad
  authority: ["FRE 403", "FRE 607", "FRE 611(a)", "FRE 608(b)", "FRE 613(b)"]
  source: original
  tags: [wave2, W2-EVD, impeachment, contradiction, collateral-matter]
  status: draft
  last_verified: "2026-11-04"

- id: Q-EVD-0063
  subject: EVD
  coverage_ids: [EVD-MBE-I.E, EVD-MBE-III.A]
  rule_ids: [R-EVD-034, R-EVD-069, R-EVD-068]
  difficulty: 3
  stem: >-
    A defendant pleaded guilty in federal court to distributing cocaine. At his sentencing hearing, the
    government seeks to prove that he also sold two more kilograms that were not charged. It calls (1) a
    detective, who testifies that a confidential informant told him that the defendant sold the informant
    two kilograms in March, and (2) the defendant's wife, who is willing to testify that one night in March,
    when they were alone at home, the defendant told her that he had "moved two more kilos." The couple
    remain married. The defendant objects to the detective's testimony as hearsay and to his wife's
    testimony as privileged.
  call: How should the court rule on the objections?
  options:
    A: "Sustain both, because the Federal Rules of Evidence apply at every stage of a federal criminal case."
    B: "Overrule both, because the Federal Rules of Evidence do not apply at sentencing."
    C: "Sustain the hearsay objection only, because the decision whether to testify against a spouse belongs to the witness-spouse."
    D: "Sustain the privilege objection only, because privilege rules apply at sentencing even though the other rules of evidence do not."
  answer: D
  explanation_correct: >-
    Proceedings (R-EVD-034): under FRE 1101(d)(3), the rules of evidence, except those on privilege, do
    not apply at sentencing, so the hearsay objection fails. Under FRE 1101(c), privilege rules apply at
    every stage. The defendant's statement to his wife, made in private during a valid marriage, is a
    confidential marital communication (R-EVD-069); both spouses hold that privilege, so the defendant
    can prevent her from disclosing it even though she is willing to testify.
  explanation_each_wrong_option:
    A: >-
      FRE 1101(d)(3) expressly excludes sentencing from the rules other than privilege.
    B: >-
      Overbroad. FRE 1101(c) makes privileges applicable in all stages of all proceedings.
    C: >-
      Confuses the two marital privileges. Under Trammel, the witness-spouse alone decides whether to give
      adverse spousal testimony (R-EVD-068), but the confidential-communications privilege is held by both
      spouses. And the hearsay rule does not apply at sentencing.
  trap_type: confused-rule
  authority: ["FRE 1101(c)", "FRE 1101(d)(3)", "FRE 501", "Trammel v. United States, 445 U.S. 40 (1980)"]
  source: original
  tags: [wave2, W2-EVD, proceedings, sentencing, marital-privilege]
  status: draft
  last_verified: "2026-11-04"
